<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f3f3;
}

.title{
background:#ff8500;
color:#fff;
text-align:center;
font-size:40px;
font-weight:bold;
padding:15px;
}

.container{
max-width:500px;
margin:auto;
padding:15px;
}

.amount{text-align:center;}

.price{
color:#ff8500;
font-size:50px;
font-weight:bold;
margin:8px 0;
}

.timer{
color:red;
font-size:32px;
margin:8px 0;
}

.qr{
text-align:center;
margin:10px 0;
}

.qr img{
width:150px;
height:150px;
object-fit:contain;
}

.pay-box{
background:#fff;
border:1px solid #ddd;
border-radius:15px;
padding:12px;
margin-top:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.pay-left{display:flex;align-items:center;gap:12px;}

.pay-left img{width:55px;height:55px;}

.pay-name{font-size:22px;font-weight:bold;}

.pay-btn{
background:#ff8500;
color:white;
border:none;
padding:8px 18px;
border-radius:8px;
cursor:pointer;
}

.manual{
background:white;
margin-top:15px;
padding:15px;
border-radius:15px;
}

.blue{color:#4f7fe8;font-weight:bold;font-size:14px;}

.upi-box{display:flex;margin-top:8px;}

.upi-box input{
flex:1;
padding:10px;
font-size:16px;
}

.copy-btn{
background:#ff8500;
color:white;
border:none;
padding:0 15px;
cursor:pointer;
}

.tip{color:orange;margin:10px 0;font-size:13px;}

.ref-input{
width:100%;
padding:10px;
font-size:16px;
margin-top:8px;
margin-bottom:8px;
}

.submit-btn{
width:100%;
background:#ff8500;
color:white;
border:none;
padding:12px;
font-size:18px;
border-radius:8px;
cursor:pointer;
}

.submit-btn:disabled{
background:#999;
cursor:not-allowed;
}

#successBox{
display:none;
padding:20px;
}

.success-card{
background:white;
max-width:500px;
margin:auto;
padding:30px 15px;
border-radius:20px;
text-align:center;
box-shadow:0 0 15px rgba(0,0,0,.08);
}

.success-card h1{
color:orange;
font-size:34px;
margin-bottom:15px;
}

.success-card p{
font-size:20px;
}
</style>
</head>

<body>

<div class="title">payment</div>

<div id="paymentPage">
<div class="container">

<div class="amount">
<div class="price" id="price">₹0.00</div>
<div class="timer" id="timer">08:00</div>
<div style="font-size:14px;">Scan QR to pay</div>
</div>

<div class="qr">
<img id="qrCode" src="">
</div>

<h3 style="font-size:16px;">Choose payment method</h3>

<div class="pay-box">
<div class="pay-left">
<img src="https://pwebassets.paytm.com/commonwebassets/paytmweb/header/images/logo_new.svg">
<div class="pay-name">Paytm</div>
</div>
<button class="pay-btn" id="paytmBtn">Pay</button>
</div>

<div class="pay-box">
<div class="pay-left">
<img src="https://download.logo.wine/logo/PhonePe/PhonePe-Logo.wine.png">
<div class="pay-name">PhonePe</div>
</div>
<button class="pay-btn" id="phonepeBtn">Pay</button>
</div>

<div class="manual">

<div class="blue">1.Copy the below given UPI</div>

<div class="upi-box">
<input type="text" id="upi" value="">
<button class="copy-btn" onclick="copyUPI()">Copy</button>
</div>

<div class="tip">Tip: Pay Fast</div>

<div class="blue">2.Need to enter your 12 Ref No (UTR)</div>

<input class="ref-input" id="utr" maxlength="12" placeholder="Enter 12 Digit UTR">

<button class="submit-btn" id="submitBtn" onclick="showSuccess()" disabled>
SUBMIT
</button>

</div>

</div>
</div>

<div id="successBox">
<div class="success-card">
<h1>Payment Successful ✓</h1>
<p>Your payment is under verification.</p>
</div>
</div>

<script>

let globalAmount = "0.00";

function copyUPI(){
navigator.clipboard.writeText(document.getElementById("upi").value);
alert("UPI Copied");
}

// QR update
function updateQR(){
let upi = document.getElementById("upi").value;

let upiLink =
"upi://pay?pa="+encodeURIComponent(upi)+
"&pn=Payment&am="+globalAmount+
"&cu=INR";

document.getElementById("qrCode").src =
"https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="
+encodeURIComponent(upiLink);
}

// open payment app
function openPayApp(){
let upi = document.getElementById("upi").value;

let link =
"upi://pay?pa="+encodeURIComponent(upi)+
"&pn=Payment&am="+globalAmount+
"&cu=INR";

window.location.href = link;
}

// buttons
document.getElementById("paytmBtn").onclick = openPayApp;
document.getElementById("phonepeBtn").onclick = openPayApp;

// UTR validation
const utrInput = document.getElementById("utr");
const submitBtn = document.getElementById("submitBtn");

utrInput.addEventListener("input", function(){
this.value = this.value.replace(/\D/g,'');
submitBtn.disabled = this.value.length !== 12;
});

function showSuccess(){
const utr = document.getElementById("utr").value;
if(!/^\d{12}$/.test(utr)){
alert("Enter valid 12 digit UTR");
return;
}

document.getElementById("paymentPage").style.display="none";
document.getElementById("successBox").style.display="block";
}

// timer
let time = 480;

setInterval(function(){
let min = Math.floor(time/60);
let sec = time%60;

document.getElementById("timer").innerText =
String(min).padStart(2,'0') + ":" + String(sec).padStart(2,'0');

if(time>0) time--;
},1000);

// URL params
function getParams(){
const urlParams = new URLSearchParams(window.location.search);

const amount = urlParams.get("amount");
const upi = urlParams.get("upi");

if(amount){
globalAmount = amount;
document.getElementById("price").innerText = "₹" + amount;
}

if(upi){
document.getElementById("upi").value = upi;
}

updateQR();
}

window.onload = function(){
getParams();
};

document.getElementById("upi")
.addEventListener("input", updateQR);

</script>

</body>
</html>
